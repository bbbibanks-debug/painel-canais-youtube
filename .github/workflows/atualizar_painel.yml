name: Atualizar Painel de Videos

on:
  schedule:
    # Roda todos os dias às 06:00 e 18:00 no Horário de Brasília (09:00 e 21:00 UTC)
    - cron: '0 9,21 * * *'
  workflow_dispatch: # Botão para rodar manualmente

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
      
    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Executar script de raspagem
        run: |
          python script_canais_multiplos.py
          mv youtube_multicanais.html index.html

      - name: Configurar o GitHub Pages
        uses: actions/configure-pages@v4

      - name: Compactar artefato da pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
